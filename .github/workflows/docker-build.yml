name: Publish container image

# 仅 idid 主分支、id-* 功能版本分支的推送自动触发；PR、标签推送和其他分支不触发。
on:
  push:
    branches:
      - idid
      - 'id-*'
  # 保留手动执行入口，可选择要校验和构建的分支或标签。
  workflow_dispatch:

# 默认只读仓库；镜像写入权限仅授予 publish 任务。
permissions:
  contents: read

# 同一个分支或标签有新运行时，取消旧运行，减少重复校验和构建。
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 后端与前端校验并行运行；生产构建统一交给 Dockerfile。
  api:
    name: Verify API
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # 用 git ls-files 限定范围，避免 gofmt 递归遍历 frontend/*/node_modules
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [[ -n "$unformatted" ]]; then
            echo "::error::The following Go files are not formatted:"
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

  # 运行两个前端的测试；类型检查和生产打包在 Docker 构建阶段执行。
  frontend:
    name: Verify frontends
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # 与两个前端 package.json 的 packageManager 版本保持一致。
          version: 10.34.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          # 按两个 lockfile 缓存 pnpm 依赖，安装时仍校验锁文件。
          cache: pnpm
          cache-dependency-path: |
            frontend/admin/pnpm-lock.yaml
            frontend/user/pnpm-lock.yaml

      # 用子 shell cd 而非 `pnpm --dir`：后者不会读取子目录的 packageManager 字段，
      # 在启用 corepack 的环境下会用错 pnpm 版本
      - name: Install frontend dependencies
        run: |
          (cd frontend/admin && pnpm install --frozen-lockfile)
          (cd frontend/user  && pnpm install --frozen-lockfile)

      - name: Run admin frontend tests
        run: (cd frontend/admin && pnpm run test)

      - name: Run user frontend tests
        run: (cd frontend/user && pnpm run test)

  publish:
    name: Build and push image
    # 两个校验任务全部成功才发布；任一失败或被取消都会跳过发布。
    needs: [api, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 镜像地址为小写 ghcr.io/<owner>/<repository>。
      # 分支构建的应用版本为“分支名-短 SHA”；手动选择标签时直接使用标签名。
      - name: Resolve image and application version
        id: image
        shell: bash
        run: |
          image_name="${GITHUB_REPOSITORY,,}"
          version="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            version="${version}-${GITHUB_SHA:0:7}"
          fi
          echo "name=ghcr.io/$image_name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Go 使用交叉编译；最终 Alpine 阶段的 RUN 指令仍需 QEMU 支持异构执行。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # 使用本次运行的 GITHUB_TOKEN 登录 GHCR，无需额外配置登录密钥。
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 为镜像添加分支名（或手动选择的标签名）和完整 SHA 标签。
      # 关闭自动 latest，仅 idid 构建更新 latest，功能版本镜像不会覆盖它。
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/idid' }}

      # Dockerfile 完成前端打包、资源嵌入和后端编译，并发布 amd64 / arm64 镜像。
      - name: Build and push multi-platform image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ steps.image.outputs.version }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          # 复用 GitHub Actions 构建缓存，mode=max 同时保留中间构建阶段的缓存。
          cache-from: type=gha,scope=fullstack-image
          cache-to: type=gha,scope=fullstack-image,mode=max

      # 使用本次构建的真实输出展示可用镜像，与 Docker 默认构建摘要一起显示。
      - name: Publish image summary
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          APP_VERSION: ${{ steps.image.outputs.version }}
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '### Dujiao-Next image published'
            echo
            printf -- '- Image: `%s`\n' "$IMAGE_NAME"
            printf -- '- App version: `%s`\n' "$APP_VERSION"
            printf -- '- Digest: `%s`\n' "$IMAGE_DIGEST"
            echo '- Platforms: `linux/amd64`, `linux/arm64`'
            echo
            echo 'Tags:'
            echo '```text'
            printf '%s\n' "$IMAGE_TAGS"
            echo '```'
            echo
            echo 'Pull by tag:'
            echo '```bash'
            while IFS= read -r tag; do
              if [[ -n "$tag" ]]; then
                printf 'docker pull %s\n' "$tag"
              fi
            done <<< "$IMAGE_TAGS"
            echo '```'
            echo
            echo 'Pull this exact build:'
            echo '```bash'
            printf 'docker pull %s@%s\n' "$IMAGE_NAME" "$IMAGE_DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
